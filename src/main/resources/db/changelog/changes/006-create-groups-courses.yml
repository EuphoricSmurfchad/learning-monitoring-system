databaseChangeLog:
  - changeSet:
      id: 006-create-groups-courses
      author: dev
      changes:
        - createTable:
            tableName: groups_courses
            columns:
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: groups_courses
            columnNames: group_id, course_id
            constraintName: pk_groups_courses

        - addForeignKeyConstraint:
            baseTableName: groups_courses
            baseColumnNames: group_id
            constraintName: fk_groups_courses_group
            referencedTableName: groups
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: groups_courses
            baseColumnNames: course_id
            constraintName: fk_groups_courses_courses
            referencedTableName: courses
            referencedColumnNames: id
            onDelete: CASCADE
