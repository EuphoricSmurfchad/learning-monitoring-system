databaseChangeLog:
  - changeSet:
      id: 004-create-groups
      author: dev
      changes:
        - createTable:
            tableName: groups
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: groups
            baseColumnNames: teacher_id
            constraintName: fk_groups_teacher
            referencedTableName: teachers
            referencedColumnNames: id
            onDelete: RESTRICT
