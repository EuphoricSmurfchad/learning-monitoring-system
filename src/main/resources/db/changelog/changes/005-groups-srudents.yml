databaseChangeLog:
  - changeSet:
      id: 005-create-groups-students
      author: dev
      changes:
        - createTable:
            tableName: groups_students
            columns:
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: groups_students
            columnNames: group_id, student_id
            constraintName: pk_groups_students

        - addForeignKeyConstraint:
            baseTableName: groups_students
            baseColumnNames: student_id
            constraintName: fk_groups_students_student
            referencedTableName: students
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: groups_students
            baseColumnNames: group_id
            constraintName: fk_groups_students_group
            referencedTableName: groups
            referencedColumnNames: id
            onDelete: CASCADE
