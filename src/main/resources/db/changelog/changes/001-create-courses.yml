databaseChangeLog:
  - changeSet:
      id: 001-create-courses
      author: dev
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    
              - addForeignKeyConstraint:
                  baseTableName: courses
                  baseColumnNames: teacher_id
                  constraintName: fk_courses_teacher
                  referencedTableName: teachers
                  referencedColumnNames: id
                  onDelete: RESTRICT
